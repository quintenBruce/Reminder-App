name: Android
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 37
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Compile with build-only Firebase configuration
        run: cp android/app/google-services.example.json android/app/google-services.json
      - uses: gradle/actions/setup-gradle@v4
      - name: Android unit tests and APKs
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest
