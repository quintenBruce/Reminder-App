# Configure a GitHub push trigger on the repository's default branch.
# Set the custom substitutions in that trigger; see docs/FIREBASE_GOOGLE_CLOUD_SETUP.md.
substitutions:
  _FUNCTIONS_REGION: us-south1
  _FIREBASE_API_KEY: 'AIzaSyCIgaL8vkRPqUtNl1JTguWvvn_xCMXXCNg'
  _FIREBASE_AUTH_DOMAIN: 'reminder-app-a2150.firebaseapp.com'
  _FIREBASE_APP_ID: '1:831855773727:web:4c432059e91512daf5ad2a'
  _FIREBASE_MESSAGING_SENDER_ID: '831855773727'
  _FIREBASE_VAPID_KEY: ''
  _RECAPTCHA_ENTERPRISE_KEY: ''
steps:
  - name: node:22
    id: verify-and-build
    entrypoint: bash
    env:
      - FUNCTIONS_REGION=${_FUNCTIONS_REGION}
      - VITE_FIREBASE_FUNCTIONS_REGION=${_FUNCTIONS_REGION}
      - VITE_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - VITE_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - VITE_FIREBASE_PROJECT_ID=$PROJECT_ID
      - VITE_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - VITE_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}
      - VITE_FIREBASE_VAPID_KEY=${_FIREBASE_VAPID_KEY}
      - VITE_RECAPTCHA_ENTERPRISE_KEY=${_RECAPTCHA_ENTERPRISE_KEY}
      - GOOGLE_CLOUD_PROJECT=$PROJECT_ID
    args:
      - -c
      - |
        set -euo pipefail
        corepack enable
        pnpm install --frozen-lockfile
        pnpm test
        pnpm run typecheck:web
        pnpm run build:functions
        node scripts/prepare-deploy.mjs
        pnpm run build:web
  # Firebase CLI 15.33.0 fails while packaging Functions with
  # "TypeError: minimatch is not a function" in this Cloud Build image.
  - name: us-docker.pkg.dev/firebase-cli/us/firebase:15.9.0
    id: deploy
    args:
      - deploy
      - --project=$PROJECT_ID
      - --config=firebase.json
      - --only=hosting,firestore,functions
      - --non-interactive
options:
  logging: CLOUD_LOGGING_ONLY
